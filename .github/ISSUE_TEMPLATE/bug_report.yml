name: Bug report
description: Something in Spinet for Android isn't working
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. The more of this you fill in, the quicker it can be fixed.
        Problems with the PC app go in [Spinet-Desktop](https://github.com/Kevcar98/Spinet-Desktop/issues), and problems with the server in [Spinet-Server](https://github.com/Kevcar98/Spinet-Server/issues).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem in a sentence or two.
      placeholder: Music stops a few minutes after I lock the phone.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      description: What did you do just before it happened?
      placeholder: |
        1. Play a playlist from my server
        2. Lock the phone
        3. Wait about five minutes
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Spinet version
      description: Shown under Settings > Updates.
      placeholder: "0.0.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone or tablet
      placeholder: Samsung Galaxy S23
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      description: Settings > About phone > Software information.
      placeholder: Android 15
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is Spinet installed?
      options:
        - APK from the GitHub release
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Where was the music coming from?
      multiple: true
      options:
        - Files on this phone
        - My own server
        - An extension
        - Not about playback
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Spinet keeps a log of what it does. Reproduce the problem, then open Settings > Updates and help and tap Share log, or Save log to Downloads, and attach the file here.
        Server addresses, links, IP addresses and your user name are left out of it automatically.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots and anything else
      description: A screenshot of any error message helps a lot. Also say how often it happens and anything you've already tried. Check screenshots for anything private, such as your server address, before posting.
